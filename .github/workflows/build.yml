name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;4.0.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Read version
        id: version
        run: |
          VC=$(git rev-list --count HEAD)
          VN="git+$(git rev-parse --short=8 HEAD)"
          TAG="${VC}-${VN}"
          MSG=$(git log -1 --pretty=%B)
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"
          echo "Version: code=$VC name=$VN tag=$TAG"

      - name: Remove old tag & release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            git push origin :refs/tags/${{ steps.version.outputs.tag }} || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BlockDirs v${{ steps.version.outputs.vn }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            阻止外置存储（OTG U 盘 / SD 卡）自动创建 Android、Music、Pictures、DCIM、Movies 等标准目录的 LSPosed 模块。

            ## 本次更新
            ${{ steps.version.outputs.msg }}

            ## 使用说明
            1. 手机需已 Root 并安装 LSPosed；
            2. 下载下方 app-release.apk 安装；
            3. 在 LSPosed 勾选 BlockDirs（模块已内置作用域推荐）；
            4. 重启手机后生效。
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  publish-mirror:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VC=$(git rev-list --count HEAD)
          VN="git+$(git rev-parse --short=8 HEAD)"
          MSG=$(git log -1 --pretty=%B)
          echo "tag=${VC}-${VN}" >> "$GITHUB_OUTPUT"
          echo "name=${VN}" >> "$GITHUB_OUTPUT"
          echo "msg=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Download APK from source release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          curl -sL -o app-release.apk "https://github.com/yixiangdebufengren/top.yixiangren.blockdirs/releases/download/${TAG}/app-release.apk"
          ls -la app-release.apk

      - name: Publish release to LSPosed mirror repo
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          REPO="Xposed-Modules-Repo/top.yixiangren.blockdirs"
          TAG="${{ steps.version.outputs.tag }}"
          VER="BlockDirs v${{ steps.version.outputs.name }}"
          MSG="${{ steps.version.outputs.msg }}"
          BODY="阻止外置存储（OTG U 盘 / SD 卡）自动创建 Android、Music、Pictures、DCIM、Movies 等标准目录的 LSPosed 模块。\n\n本次更新：\n${MSG}"
          API="https://api.github.com/repos/$REPO"

          # 1. 删除同 tag 的旧 release（若存在），避免重复
          for rid in $(curl -s -H "Authorization: token $TOKEN" "$API/releases" | jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .id' 2>/dev/null); do
            echo "删除旧 release $rid (tag=$TAG)"
            curl -s -X DELETE -H "Authorization: token $TOKEN" "$API/releases/$rid" >/dev/null 2>&1 || true
          done

          # 2. 删除旧 tag ref（先查存在性，存在才删，消除 422 假失败）
          if curl -s -H "Authorization: token $TOKEN" "$API/git/refs/tags/$TAG" | jq -e '.ref' >/dev/null 2>&1; then
            echo "删除旧 tag $TAG"
            curl -s -X DELETE -H "Authorization: token $TOKEN" "$API/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          # 3. 取 main 分支 sha 作为 tag 指向
          MAIN_SHA=$(curl -s -H "Authorization: token $TOKEN" "$API/git/refs/heads/main" | jq -r '.object.sha')
          test -n "$MAIN_SHA" && test "$MAIN_SHA" != "null"

          # 4. 创建 release（带 target_commitish，让 GitHub 自动创建 lightweight tag，消除竞态）
          RESP=$(curl -s --fail -X POST -H "Authorization: token $TOKEN" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$MAIN_SHA\",\"name\":\"$VER\",\"body\":\"$BODY\",\"draft\":false,\"prerelease\":false}" \
            "$API/releases")
          UPLOAD_URL=$(echo "$RESP" | jq -r '.upload_url')
          test -n "$UPLOAD_URL" && test "$UPLOAD_URL" != "null"

          # 5. 上传 APK
          UPLOAD_URL="${UPLOAD_URL%\{*}?name=app-release.apk"
          curl -s --fail -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@app-release.apk" "$UPLOAD_URL" >/dev/null

          # 6. 同步 README 到镜像仓库（让模块详情页显示完整介绍）
          if [ -f README.md ]; then
            README_B64=$(base64 -w0 README.md)
            # 查镜像仓库 README.md 当前 sha（存在则更新，否则创建）
            README_SHA=$(curl -s -H "Authorization: token $TOKEN" "$API/contents/README.md" | jq -r '.sha // empty')
            if [ -n "$README_SHA" ]; then
              echo "更新镜像 README.md (sha=$README_SHA)"
              curl -s --fail -X PUT -H "Authorization: token $TOKEN" \
                -d "{\"message\":\"docs: 同步 README\",\"content\":\"$README_B64\",\"sha\":\"$README_SHA\"}" \
                "$API/contents/README.md" >/dev/null
            else
              echo "创建镜像 README.md"
              curl -s --fail -X PUT -H "Authorization: token $TOKEN" \
                -d "{\"message\":\"docs: 初始化 README\",\"content\":\"$README_B64\"}" \
                "$API/contents/README.md" >/dev/null
            fi
          fi

          echo "mirror release published ($TAG), bot will publish in 5min"
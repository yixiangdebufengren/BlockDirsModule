name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;4.0.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      # 固定 tag 为 VersionCode-VersionName 格式（官方仓库要求）
      # 先删除已存在的同名 tag/release，再重建，保证 Releases 页只有一个最新版
      - name: Remove old tag & release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git rev-parse "1-1.0" >/dev/null 2>&1; then
            git push origin :refs/tags/1-1.0 || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1-1.0
          name: BlockDirs v1.0
          files: app/build/outputs/apk/release/*.apk
          body: |
            阻止外置存储（OTG U 盘 / SD 卡）自动创建 Android、Music、Pictures、DCIM、Movies 等标准目录的 LSPosed 模块。

            ## 使用说明
            1. 手机需已 Root 并安装 LSPosed；
            2. 下载下方 app-release.apk 安装；
            3. 在 LSPosed 勾选 BlockDirs（模块已内置作用域推荐）；
            4. 重启手机后生效。
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

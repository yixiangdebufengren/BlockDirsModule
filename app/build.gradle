plugins {
    id 'com.android.application'
}

// 自动版本号：versionCode = git 提交数，versionName = "git+<短hash>"
// 形如 1819-git+b22aa570，每次提交自动递增，无需手动维护
def verCode = 'git rev-list --count HEAD'.execute([], projectDir).text.trim().toInteger()
def verName = 'git+' + 'git rev-parse --short=8 HEAD'.execute([], projectDir).text.trim()

android {
    namespace 'top.yixiangren.blockdirs'
    compileSdk 34

    defaultConfig {
        applicationId "top.yixiangren.blockdirs"
        minSdk 30
        targetSdk 34
        versionCode verCode
        versionName verName

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            // release 复用 debug 签名，保证可覆盖安装，无需单独 keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 复用 debug 签名：release 与 debug 可互覆盖安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation project(':native')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
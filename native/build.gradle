plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.blockdirs'
    compileSdk 34

    defaultConfig {
        minSdk 30
        targetSdk 34

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            // 不指定 version，使用 AGP 默认的 CMake 版本（自动下载）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 native 库，无需额外依赖
}